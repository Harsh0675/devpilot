name: Build and release DevPilot

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: devpilot-windows-x64
          - name: Linux x64
            os: ubuntu-latest
            artifact: devpilot-linux-x64
          - name: macOS Intel
            os: macos-13
            artifact: devpilot-macos-x64
          - name: macOS Apple Silicon
            os: macos-14
            artifact: devpilot-macos-arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Validate source
        run: |
          python -m compileall -q devpilot
          python -m devpilot --version
          python -m devpilot --help
          python -m devpilot.agent_cli --help

      - name: Build executables
        run: |
          pyinstaller --clean --noconfirm --onefile --name devpilot devpilot/__main__.py
          pyinstaller --clean --noconfirm --onefile --name devpilot-agent devpilot/agent_cli.py

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force installer | Out-Null
          Copy-Item dist/devpilot.exe installer/devpilot.exe
          Copy-Item dist/devpilot-agent.exe installer/devpilot-agent.exe
          $version = (Select-String -Path pyproject.toml -Pattern 'version = "([^"]+)"').Matches.Groups[1].Value
          @"
          [Setup]
          AppId={{B5C3B7C6-5E35-4E8C-9B8C-DEVPILOT0700}}
          AppName=DevPilot
          AppVersion=$version
          AppPublisher=Harsh Nagar
          DefaultDirName={autopf}\DevPilot
          DefaultGroupName=DevPilot
          OutputDir=.
          OutputBaseFilename=DevPilot-$version-windows-x64-setup
          ArchitecturesInstallIn64BitMode=x64
          UninstallDisplayIcon={app}\devpilot.exe
          Compression=lzma
          SolidCompression=yes
          [Files]
          Source: "devpilot.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "devpilot-agent.exe"; DestDir: "{app}"; Flags: ignoreversion
          [Icons]
          Name: "{group}\DevPilot"; Filename: "{app}\devpilot.exe"
          Name: "{group}\DevPilot Agent"; Filename: "{app}\devpilot-agent.exe"
          [Run]
          Filename: "{app}\devpilot.exe"; Description: "Launch DevPilot"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content installer/devpilot.iss
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/devpilot.iss
          Compress-Archive -Path installer/devpilot.exe,installer/devpilot-agent.exe -DestinationPath DevPilot-$version-windows-x64.zip
          Get-FileHash installer/DevPilot-$version-windows-x64-setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  DevPilot-$version-windows-x64-setup.exe" } | Set-Content SHA256SUMS-windows.txt
          Get-FileHash DevPilot-$version-windows-x64.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  DevPilot-$version-windows-x64.zip" } | Add-Content SHA256SUMS-windows.txt

      - name: Linux AppImage and tarball
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mkdir -p package/usr/bin package/usr/share/applications
          cp dist/devpilot package/usr/bin/devpilot
          cp dist/devpilot-agent package/usr/bin/devpilot-agent
          chmod 755 package/usr/bin/devpilot package/usr/bin/devpilot-agent
          cp README.md package/README.md
          printf '%s\n' '[Desktop Entry]' 'Name=DevPilot' 'Exec=devpilot' 'Type=Application' 'Categories=Development;' 'Icon=devpilot' > package/usr/share/applications/devpilot.desktop
          cp package/usr/share/applications/devpilot.desktop package/devpilot.desktop
          cat > package/devpilot.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><rect width="256" height="256" rx="48" fill="#111827"/><path d="M72 72h112v32H104v24h64v32h-64v24h80v32H72z" fill="#fff"/></svg>
          EOF
          printf '%s\n' '#!/bin/sh' 'HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"' 'exec "$HERE/usr/bin/devpilot" "$@"' > package/AppRun
          chmod 755 package/AppRun
          cat > install.sh <<'EOF'
          #!/bin/sh
          set -eu
          PREFIX="${PREFIX:-$HOME/.local}"
          mkdir -p "$PREFIX/bin"
          SCRIPT_DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          cp "$SCRIPT_DIR/package/usr/bin/devpilot" "$PREFIX/bin/devpilot"
          cp "$SCRIPT_DIR/package/usr/bin/devpilot-agent" "$PREFIX/bin/devpilot-agent"
          chmod 755 "$PREFIX/bin/devpilot" "$PREFIX/bin/devpilot-agent"
          printf '%s\n' "Installed DevPilot to $PREFIX/bin"
          EOF
          chmod 755 install.sh
          tar -czf DevPilot-$VERSION-linux-x64.tar.gz -C package .
          curl -L --fail --retry 3 -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage package DevPilot-$VERSION-linux-x64.AppImage
          sha256sum DevPilot-$VERSION-linux-x64.tar.gz DevPilot-$VERSION-linux-x64.AppImage install.sh > SHA256SUMS-linux.txt

      - name: macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mkdir -p "DevPilot.app/Contents/MacOS"
          cp dist/devpilot "DevPilot.app/Contents/MacOS/devpilot"
          cp dist/devpilot-agent "DevPilot.app/Contents/MacOS/devpilot-agent"
          chmod 755 "DevPilot.app/Contents/MacOS/devpilot" "DevPilot.app/Contents/MacOS/devpilot-agent"
          cat > "DevPilot.app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>DevPilot</string>
          <key>CFBundleDisplayName</key><string>DevPilot</string>
          <key>CFBundleIdentifier</key><string>com.harshnagar.devpilot</string>
          <key>CFBundleVersion</key><string>$VERSION</string>
          <key>CFBundleShortVersionString</key><string>$VERSION</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleExecutable</key><string>devpilot</string>
          </dict></plist>
          EOF
          hdiutil create -volname "DevPilot $VERSION" -srcfolder DevPilot.app -ov -format UDZO "DevPilot-$VERSION-${{ matrix.artifact }}.dmg"
          tar -czf "DevPilot-$VERSION-${{ matrix.artifact }}.tar.gz" DevPilot.app
          shasum -a 256 "DevPilot-$VERSION-${{ matrix.artifact }}.dmg" "DevPilot-$VERSION-${{ matrix.artifact }}.tar.gz" > SHA256SUMS-macos-${{ matrix.artifact }}.txt

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            DevPilot-*.zip
            DevPilot-*.tar.gz
            DevPilot-*.AppImage
            DevPilot-*.dmg
            install.sh
            installer/*.exe
            SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish v0.7.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.0
          target_commitish: main
          name: DevPilot v0.7.0
          files: release-assets/**
          generate_release_notes: true
          fail_on_unmatched_files: true
