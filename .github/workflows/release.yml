name: Build and release DevPilot

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: devpilot-windows-x64
            archive: devpilot-windows-x64.zip
          - os: ubuntu-latest
            artifact: devpilot-linux-x64
            archive: devpilot-linux-x64.tar.gz

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Validate source
        run: |
          python -m compileall -q devpilot
          python -m devpilot --version
          python -m devpilot --help
          python -m devpilot.agent_cli --help

      - name: Build executables
        run: |
          pyinstaller --clean --noconfirm --onefile --name devpilot devpilot/__main__.py
          pyinstaller --clean --noconfirm --onefile --name devpilot-agent devpilot/agent_cli.py

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/devpilot.exe package/devpilot.exe
          Copy-Item dist/devpilot-agent.exe package/devpilot-agent.exe
          Copy-Item README.md package/README.md
          Compress-Archive -Path package/* -DestinationPath devpilot-windows-x64.zip
          Get-FileHash devpilot-windows-x64.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  devpilot-windows-x64.zip" } | Set-Content SHA256SUMS-windows.txt

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p package
          cp dist/devpilot package/devpilot
          cp dist/devpilot-agent package/devpilot-agent
          chmod 755 package/devpilot package/devpilot-agent
          cp README.md package/README.md
          tar -czf devpilot-linux-x64.tar.gz -C package .
          sha256sum devpilot-linux-x64.tar.gz > SHA256SUMS-linux.txt

      - name: Upload CI package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.archive }}
            SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive }}
            SHA256SUMS-*.txt
          generate_release_notes: true
