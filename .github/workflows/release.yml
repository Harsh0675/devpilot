name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} package
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: devpilot-windows-x64
            archive: devpilot-windows-x64.zip
          - os: ubuntu-latest
            artifact: devpilot-linux-x64
            archive: devpilot-linux-x64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller .
          if [ "${{ runner.os }}" = "Windows" ]; then
            pyinstaller --onefile --name devpilot devpilot/__main__.py
          else
            pyinstaller --onefile --name devpilot devpilot/__main__.py
          fi

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/devpilot.exe package/devpilot.exe
          Copy-Item README.md package/README.md
          Compress-Archive -Path package/* -DestinationPath devpilot-windows-x64.zip

      - name: Create Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p package
          cp dist/devpilot package/devpilot
          chmod +x package/devpilot
          cp README.md package/README.md
          tar -czf devpilot-linux-x64.tar.gz -C package .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}

      - name: Attach package to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          generate_release_notes: true
