[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devpilot"
version = "0.6.0"
description = "Production-grade AI coding copilot for project intelligence, safe code changes, testing, and build automation."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Harsh Nagar"}]

[project.scripts]
devpilot = "devpilot.cli:main"

[tool.setuptools.packages.find]
include = ["devpilot*"]
