[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devpilot"
version = "0.8.0"
description = "Autonomous multi-agent AI software engineering platform for Windows, Linux, and macOS."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Harsh Nagar"}]

[project.scripts]
devpilot = "devpilot.versioned_cli:main"
devpilot-agent = "devpilot.agent_cli:main"

[tool.setuptools.packages.find]
include = ["devpilot*"]
