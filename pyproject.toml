[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devpilot"
version = "0.4.0"
description = "Online AI autonomous developer agent for project intelligence, safe code changes, and build automation."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Harsh Nagar"}]

[project.scripts]
devpilot = "devpilot.cli:main"

[tool.setuptools.packages.find]
include = ["devpilot*"]
